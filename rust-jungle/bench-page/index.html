<!doctype html>
<html>
<head><meta charset="utf-8"><title>jungle-wasm search bench</title></head>
<body>
  <pre id="out">loading…</pre>
  <script>
    (async () => {
      const out = document.getElementById("out");
      const { instance } = await WebAssembly.instantiateStreaming(
        fetch("jungle_wasm.wasm"), {});
      const perft = instance.exports.perft;
      const searchNodes = instance.exports.search_nodes;
      const perft4 = Number(perft(4));

      // Warm up, then time a depth-10 search (several seconds of pure search).
      searchNodes(6);
      const budgetMs = 2000;
      const t0 = performance.now();
      let nodes = 0;
      let depth = 8;
      while (performance.now() - t0 < budgetMs) {
        nodes += Number(searchNodes(depth));
        depth++;
      }
      const elapsed = performance.now() - t0;
      const nps = Math.round(nodes / (elapsed / 1000));
      out.textContent = `nodes=${nodes} nps=${nps} perft4=${perft4}`;
      document.body.dataset.result = `nps=${nps}`;
    })().catch(e => {
      document.getElementById("out").textContent = "error: " + e;
      document.body.dataset.result = "error";
    });
  </script>
</body>
</html>
