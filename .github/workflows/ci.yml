name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.94.1 + wasm target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-tools 1.263.0
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.263.0

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rust format
        working-directory: engine
        run: cargo fmt --all -- --check

      - name: Rust lint (-D warnings)
        working-directory: engine
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        working-directory: engine
        run: cargo test --workspace

      - name: Generated identity/theme drift gate
        run: |
          node scripts/sync-identity.mjs --check
          node scripts/gen-theme.mjs --check

      - name: Canonical rules digest gate
        run: node scripts/check-rules-digest.mjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build release (wasm, site, single file, conformance host, hashes)
        run: npm run build

      - name: Admission checklist against the release file
        run: node scripts/admission.mjs

      - name: Rules/referee/wasm parity tests
        run: npm test

      - name: Arena conformance (admission + 3 complete matches)
        run: node scripts/conformance.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser end-to-end tests
        run: npx playwright test

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-artifact
          path: dist

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            release/
            docs/CONFORMANCE.md
            docs/ADMISSION.md
            docs/STRENGTH.md
            docs/screenshots/
            test-results/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-test
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pages-artifact
          path: dist
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler@4 pages deploy dist --project-name deepseek-jungle
      - name: Verify live headers and assets
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          curl -fsSI https://deepseek-jungle.pages.dev/ | head -20
          curl -fsSI https://deepseek-jungle.pages.dev/assets/deepseek-v4-pro-claude-code-2.0.0.wasm | head -20
