name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install wasm-tools workload (AOT publish)
        run: dotnet workload install wasm-tools

      - name: Build (Release)
        run: dotnet build JungleGame.sln -c Release

      - name: Run engine, AI and web test suites
        run: dotnet test JungleGame.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Coverage gate (Core line coverage >= 80%)
        run: |
          dotnet test tests/JungleGame.Tests -c Release --no-build --collect:"XPlat Code Coverage"
          pwsh -File scripts/check-coverage.ps1

      - name: Engine crash smoke (self-play)
        run: dotnet run --project src/JungleGame.Bench -c Release --no-build -- --selfplay --games 2 --timeA 1000 --timeB 300

      - name: Publish Blazor app (AOT)
        run: dotnet publish src/JungleGame.Web/JungleGame.Web.csproj -c Release --no-build

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-artifact
          path: src/JungleGame.Web/bin/Release/net8.0/publish/wwwroot

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Download static site artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-artifact
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run Playwright E2E (includes AI-vs-AI WASM smoke)
        working-directory: e2e
        env:
          WWWROOT: ${{ github.workspace }}/dist
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build-and-test, e2e]
    steps:
      - uses: actions/checkout@v4

      - name: Download static site artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-artifact
          path: dist

      # Deploys only when the repository secret CLOUDFLARE_API_TOKEN is configured;
      # otherwise the build+test pipeline still runs and deploy is skipped.
      - name: Deploy to Cloudflare Pages (project deepseek-jungle)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler@4 pages deploy dist --project-name deepseek-jungle
