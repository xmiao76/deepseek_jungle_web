[workspace]
resolver = "2"
members = [
    "crates/jungle-identity",
    "crates/jungle-core",
    "crates/jungle-render",
    "crates/jungle-component",
    "crates/jungle-webengine",
    "crates/jungle-fixture",
    "crates/jungle-cli",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
